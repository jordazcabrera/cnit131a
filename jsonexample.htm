<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JSON Array</title>

<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
$(document).ready(function () {

    // Load JSON data
    $.getJSON('people.json', function (data) {

        // Loop through each person object
        $.each(data.person, function (i, f) {

            // Build table row (MATCHES table headers now)
            var tblRow = "<tr>" +
                "<td>" + f.firstName + "</td>" +
                "<td>" + f.lastName + "</td>" +
                "<td>" + f.email + "</td>" +
                "<td>" + f.city + "</td>" +
                "</tr>";

            // Append row to table
            $("#userdata tbody").append(tblRow);
        });

    }).fail(function () {
        console.log("Error loading JSON file.");
    });

});
</script>

</head>

<body>

<div class="wrapper">
<div class="profile">

<table id="userdata" border="2">
<thead>
    <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email Address</th>
        <th>City</th>
    </tr>
</thead>

<tbody>
</tbody>

</table>

</div>
</div>

</body>
</html>
