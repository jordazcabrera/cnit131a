<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<!-- Page title shown in browser tab -->
<title>JSON Array</title>

<!-- jQuery library (used to simplify JavaScript and AJAX calls) -->
<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js"></script>

<script>
    // Run this code when the page is fully loaded
    $(function() {

        // Create an empty array (not used later, but declared here)
        var people = [];

        // Fetch JSON data from the file 'people.json'
        $.getJSON('people.json', function(data) {

            // Loop through each person object in the JSON data
            $.each(data.person, function(i, f) {

                // Create a table row with data from JSON (first name, last name, job)
                var tblRow = "<tr>" +
                    "<td>" + f.firstName + "</td>" +
                    "<td>" + f.lastName + "</td>" +
                    "<td>" + f.job + "</td>" +
                    "</td>" +  // (extra closing </td> — likely a mistake)
                    "</tr>";

                // Append the row to the table body
                $(tblRow).appendTo("#userdata tbody");
            });

        });

    });
</script>

</head> 

<body>

<!-- Main wrapper for layout -->
<div class="wrapper">

    <!-- Profile section containing the table -->
    <div class="profile">

        <!-- Table to display user data -->
        <table id="userdata" border="2">

            <!-- Table header -->
            <thead>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email Address</th>
                <th>City</th>
            </thead>

            <!-- Table body (rows will be inserted here dynamically) -->
            <tbody>
            </tbody>

        </table>

    </div>
</div>

</body>
</html>
