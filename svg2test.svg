<svg xmlns="http://www.w3.org/2000/svg"
     width="500" height="250">

  <!-- Red horizontal line -->
  <!-- x1,y1 = start point | x2,y2 = end point -->
  <line x1="10" y1="10" x2="400" y2="10"
        stroke="red"
        stroke-width="3" />

  <!-- Blue diagonal line -->
  <line x1="10" y1="10" x2="400" y2="110"
        stroke="blue"
        stroke-width="5" />

  <!-- Green dashed horizontal line -->
  <!-- stroke-dasharray controls dash pattern: dash length, gap -->
  <line x1="10" y1="120" x2="400" y2="120"
        stroke="green"
        stroke-width="5"
        stroke-dasharray="15,2" />

  <!-- Thick orange dashed line -->
  <!-- Pattern: dash, gap, dash -->
  <line x1="10" y1="150" x2="400" y2="150"
        stroke="orange"
        stroke-width="15"
        stroke-dasharray="10,2,10" />

</svg>
